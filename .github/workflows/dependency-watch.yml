name: Upstream dependency watch

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pinned upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-upstream-releases.sh --fail-on-update
